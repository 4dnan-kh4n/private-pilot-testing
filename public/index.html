<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A secure two-step application validation demo">
  <title>Application Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <section class="card">
      <div class="eyebrow">STEP 1 OF 2</div>
      <h1>Create your application</h1>
      <p class="intro">Enter your basic details.</p>

      <form id="registrationForm" novalidate>
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" minlength="2" maxlength="80" autocomplete="name" required>

        <label for="age">Age</label>
        <input id="age" name="age" type="number" min="16" max="100" required>

        <label for="accountNumber">Account number</label>
        <input id="accountNumber" name="accountNumber" type="text" inputmode="numeric" pattern="[0-9 -]{6,22}" autocomplete="off" required>

        <p id="formMessage" class="message" role="alert"></p>
        <button type="submit">Save &amp; Next <span>→</span></button>
      </form>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
