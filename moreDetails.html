<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>More Details</title>
</head>

<body>

    <h1>Validate Your Details</h1>

    <div id="storedDetails">
        <p id="details"></p>

        <button onclick="validateDetails()">Validate</button>
    </div>


    <!-- This will appear after validation -->

    <div id="validatedData" style="display: none;">

        <h2>Validated Details</h2>

        <p>Name: <span id="finalName"></span></p>

        <p>Age: <span id="finalAge"></span></p>

        <p>Account Number: <span id="finalAccNo"></span></p>

        <br>

        <label for="hireReason">
            Why would we hire you?
        </label>

        <input type="text" id="hireReason">

        <br><br>

        <button>Submit</button>

    </div>


    <script src="script.js"></script>

</body>
</html>
